# Put this file in your repo at:  .github/workflows/store.yml
name: Daily store

on:
  schedule:
    - cron: '7 */2 * * *'   # every 2 hours (00:07 UTC = 3:07 AM Qatar, right after the daily reset)
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write            # lets the bot save its small memory file between runs

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Load what the bot remembers from last run (what it already notified you about)
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: store-state-${{ github.run_id }}
          restore-keys: store-state-

      - name: Check store
        run: node check-store.js
        env:
          RIOT_SSID: ${{ secrets.RIOT_SSID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SHARD: ap
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: store-state-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
